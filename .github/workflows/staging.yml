# Staging — EAS internal builds against Supabase `develop`
#
# Required repo secret:
#   EXPO_TOKEN — from expo.dev → Access tokens
#
# EAS preview env should already have:
#   EXPO_PUBLIC_SUPABASE_URL / EXPO_PUBLIC_SUPABASE_KEY (develop branch)
name: Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        required: true
        default: all
        type: choice
        options: [all, ios, android]

concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: EAS staging build
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Expo / EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build staging (non-blocking)
        # --no-wait: CI kicks off the EAS build and exits; watch progress on expo.dev
        run: >
          eas build
          --profile staging
          --platform ${{ github.event.inputs.platform || 'all' }}
          --non-interactive
          --no-wait
